<svg xmlns="http://www.w3.org/2000/svg" width="820" height="690" viewBox="0 0 820 690" role="img" aria-label="Say Less local correction learning workflow"><rect width="820" height="690" fill="#111317"/><g font-family="system-ui,sans-serif"><text x="40" y="40" fill="#b8ff65" font-size="24">Say Less · speak, correct, remember</text><rect x="40" y="65" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="94" fill="white" font-size="20">Speak → local speech model</text><text x="60" y="120" fill="#d3d7df" font-size="15">Hold, tap, or double-tap · compact companion or expanded dock</text><path d="M410 143 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="165" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="194" fill="white" font-size="20">Format → paste</text><text x="60" y="220" fill="#d3d7df" font-size="15">Optional AI cleanup → local formatting and explicit spelling rules</text><path d="M410 243 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="265" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="294" fill="white" font-size="20">Watch that field only, if enabled</text><text x="60" y="320" fill="#d3d7df" font-size="15">Mac accessible text field · stop on focus change · 90-second maximum</text><path d="M410 343 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="365" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="394" fill="white" font-size="20">Notice a stable spelling edit</text><text x="60" y="420" fill="#d3d7df" font-size="15">One similar word changed · keep surrounding field contents only in RAM</text><path d="M410 443 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="465" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="494" fill="white" font-size="20">Keep the pair locally</text><text x="60" y="520" fill="#d3d7df" font-size="15">First observation appears in Writing · Keep now or repeat in another dictation</text><path d="M410 543 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="565" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="594" fill="white" font-size="20">Apply, review, or remove</text><text x="60" y="620" fill="#d3d7df" font-size="15">Active corrections apply to future dictation · explicit rules take priority</text><text x="40" y="677" fill="#d3d7df" font-size="13">Exact action/snippet paths bypass AI; learning skips unsupported fields and automatic sending.</text></g></svg>