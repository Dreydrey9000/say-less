<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc"><title id="title">Say Less personalization boundaries</title><desc id="desc">Appearance updates local windows. Voice actions require exact opt-in cues. Wispr data is read-only, previewed, then imported into local storage.</desc><style>text{font:15px system-ui;fill:#eef1f5}.box{fill:#222832;stroke:#8a939f;rx:12}.arrow{stroke:#b8ff65;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#b8ff65"/></marker></defs><rect width="1040" height="420" fill="#111318"/><text x="30" y="35" style="font-size:22px;font-weight:700">Say Less • local personalization</text><rect class="box" x="30" y="65" width="250" height="65"/><text x="50" y="92">Appearance → studio.json</text><text x="50" y="114">Color and dock preferences</text><path class="arrow" d="M280 98H340"/><rect class="box" x="340" y="65" width="310" height="65"/><text x="360" y="92">Settings + recording overlay + dock</text><text x="360" y="114">Live accent updates</text><rect class="box" x="30" y="170" width="250" height="65"/><text x="50" y="197">Original recognized utterance</text><text x="50" y="219">Exact “Say Less…” cue only</text><path class="arrow" d="M280 203H340"/><rect class="box" x="340" y="170" width="310" height="65"/><text x="360" y="197">Opt-in action + target validation</text><text x="360" y="219">Never execute AI / snippet output</text><path class="arrow" d="M650 203H710"/><rect class="box" x="710" y="170" width="295" height="65"/><text x="730" y="197">Open installed app or http/https</text><text x="730" y="219">No match → normal dictation</text><rect class="box" x="30" y="280" width="250" height="65"/><text x="50" y="307">Wispr SQLite (read-only)</text><text x="50" y="329">or user-selected CSV / JSON</text><path class="arrow" d="M280 313H340"/><rect class="box" x="340" y="280" width="310" height="65"/><text x="360" y="307">Preview → fingerprint → apply</text><text x="360" y="329">Skip duplicates; preserve backup</text><path class="arrow" d="M650 313H710"/><rect class="box" x="710" y="280" width="295" height="65"/><text x="730" y="307">Local dictionary + snippets</text><text x="730" y="329">Optional text history archive</text><text x="30" y="389">No cloud migration • No credentials, audio, screenshots, or team permissions copied</text></svg>