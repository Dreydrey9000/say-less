<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc"><title id="title">Say Less screen recording</title><desc id="desc">The Home card, dock, tray and a spoken cue all call the Rust screen recorder. It checks permissions, then the Swift ScreenCaptureKit bridge writes one MP4 with screen, microphone and system audio to Movies, Say Less.</desc>
<style>rect{fill:#1b1e24;stroke:#8796ab;stroke-width:1.5;rx:10}text{fill:#e7eaee;font:14px system-ui,sans-serif}.s{font-size:12px;fill:#aab3bf}.a{stroke:#b8ff65;stroke-width:2;fill:none;marker-end:url(#m)}.w{fill:#ff5a5a;stroke:none}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8ff65"/></marker></defs>
<rect x="0" y="0" width="1080" height="420" style="fill:#111317;stroke:none"/>
<rect x="20" y="30" width="210" height="50"/><text x="36" y="60">Home card: Record screen</text>
<rect x="20" y="100" width="210" height="50"/><text x="36" y="130">Floating dock button</text>
<rect x="20" y="170" width="210" height="50"/><text x="36" y="200">Tray: Record Screen</text>
<rect x="20" y="240" width="210" height="64"/><text x="36" y="266">Shortcut, then say</text><text x="36" y="288" class="s">"say less start recording"</text>
<rect x="290" y="240" width="200" height="64"/><text x="304" y="266">recording_cue</text><text x="304" y="288" class="s">before custom actions, no paste</text>
<rect x="540" y="110" width="220" height="80"/><text x="556" y="140">Rust screen_recorder</text><text x="556" y="162" class="s">start, stop, status</text><text x="556" y="180" class="s">checks both permissions first</text>
<rect x="820" y="20" width="240" height="64"/><text x="836" y="46">Permission missing</text><text x="836" y="68" class="s">plain message + System Settings</text>
<rect x="820" y="110" width="240" height="80"/><text x="836" y="138">Swift bridge (macOS 15+)</text><text x="836" y="160" class="s">ScreenCaptureKit</text><text x="836" y="178" class="s">SCRecordingOutput, own windows hidden</text>
<rect x="820" y="220" width="240" height="90"/><text x="836" y="248">One MP4 file</text><text x="836" y="270" class="s">~/Movies/Say Less/</text><text x="836" y="288" class="s">H.264 1080p30 + AAC</text><text x="836" y="304" class="s">mic mixed with system audio</text>
<rect x="540" y="330" width="520" height="64"/><text x="556" y="356">Every window and the tray update</text><text x="556" y="378" class="s">red dot, mm:ss timer, Saved, Show in Finder</text>
<rect x="290" y="330" width="200" height="64"/><text x="304" y="356">Windows, Linux, old macOS</text><text x="304" y="378" class="s">disabled with a reason</text>
<path class="a" d="M230 55H520V130H538"/><path class="a" d="M230 125H538"/><path class="a" d="M230 195H520V165H538"/><path class="a" d="M230 272H288"/><path class="a" d="M490 272H650V192"/>
<path class="a" d="M760 125H790V52H818"/><path class="a" d="M760 150H818"/><path class="a" d="M940 190V218"/><path class="a" d="M650 190V328"/><path class="a" d="M540 180H390V328"/>
</svg>
