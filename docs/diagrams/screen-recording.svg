<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc"><title id="title">Say Less screen recording</title><desc id="desc">The Home card, dock, tray and a spoken cue call the Rust screen recorder, which reads the saved recording setup. It checks only the permissions that setup needs, then the Swift ScreenCaptureKit bridge records the screen or one window with the microphone and system audio. When the webcam is on, a round camera window floats on screen and is included in the recording while other Say Less windows stay out. One MP4 lands in Movies, Say Less.</desc>
<style>rect{fill:#1b1e24;stroke:#8796ab;stroke-width:1.5;rx:10}text{fill:#e7eaee;font:14px system-ui,sans-serif}.s{font-size:12px;fill:#aab3bf}.a{stroke:#b8ff65;stroke-width:2;fill:none;marker-end:url(#m)}.w{fill:#ff5a5a;stroke:none}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8ff65"/></marker></defs>
<rect x="0" y="0" width="1180" height="500" style="fill:#111317;stroke:none"/>
<rect x="20" y="30" width="230" height="230"/>
<text x="36" y="56">Ways to start or stop</text>
<text x="36" y="92" class="s">Home card: Record screen</text>
<text x="36" y="122" class="s">Floating dock button</text>
<text x="36" y="152" class="s">Tray: Record Screen</text>
<text x="36" y="182" class="s">Shortcut, then say</text>
<text x="36" y="200" class="s">"say less start recording"</text>
<text x="36" y="236" class="s">(voice: nothing is pasted)</text>
<rect x="20" y="300" width="330" height="170"/>
<text x="36" y="326">Recording setup</text>
<text x="36" y="350" class="s">Home panel, or the dock's setup button</text>
<text x="36" y="376" class="s">Whole screen (which display) or one window</text>
<text x="36" y="398" class="s">Microphone on/off + which mic, computer sound</text>
<text x="36" y="420" class="s">Webcam + camera, corner, small/medium/large</text>
<text x="36" y="442" class="s">720p / 1080p / native, 30 / 60 fps</text>
<text x="36" y="462" class="s">Saved in recording.json (default 1080p30)</text>
<rect x="330" y="110" width="250" height="90"/>
<text x="346" y="138">Rust screen_recorder</text>
<text x="346" y="162" class="s">start / stop / status</text>
<text x="346" y="184" class="s">reads the saved setup</text>
<path class="a" d="M250 145H326"/>
<path class="a" d="M200 300C200 260 380 250 420 204"/>
<rect x="660" y="30" width="250" height="80"/>
<text x="676" y="58">Permission missing</text>
<text x="676" y="82" class="s">only what the setup needs: screen,</text>
<text x="676" y="100" class="s">mic, camera. Open System Settings</text>
<path class="a" d="M580 135C620 110 630 80 656 72"/>
<rect x="660" y="150" width="250" height="80"/>
<text x="676" y="178">Swift bridge (macOS 15+)</text>
<text x="676" y="202" class="s">ScreenCaptureKit SCRecordingOutput</text>
<text x="676" y="220" class="s">Apple's hardware encoder</text>
<path class="a" d="M580 165H656"/>
<rect x="660" y="270" width="250" height="100"/>
<circle cx="880" cy="340" r="18" style="fill:#e2b48f;stroke:#fff;stroke-width:2"/>
<text x="676" y="298">Webcam bubble</text>
<text x="676" y="322" class="s">round window, on top, drag it</text>
<text x="676" y="340" class="s">recorded; other Say Less</text>
<text x="676" y="358" class="s">windows stay out</text>
<path class="a" d="M785 230V266"/>
<rect x="950" y="150" width="210" height="130"/>
<text x="966" y="178">One MP4</text>
<text x="966" y="202" class="s">Movies/Say Less/</text>
<text x="966" y="222" class="s">H.264 + AAC (mic mixed</text>
<text x="966" y="240" class="s">with system audio)</text>
<text x="966" y="260" class="s">face burned into the video</text>
<path class="a" d="M910 190H946"/>
<path class="a" d="M910 320C930 320 940 280 950 270"/>
<rect x="380" y="420" width="370" height="60"/>
<text x="396" y="446">screen-recording-changed event</text>
