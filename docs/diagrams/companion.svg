<svg xmlns="http://www.w3.org/2000/svg" width="820" height="680" viewBox="0 0 820 680" role="img" aria-label="Say Less companion and dictation workflow"><rect width="820" height="680" fill="#111317"/><g font-family="system-ui,sans-serif"><text x="40" y="40" fill="#b8ff65" font-size="24">Say Less · companion and dictation</text><rect x="40" y="65" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="94" fill="white" font-size="20">Appearance + Writing</text><text x="60" y="120" fill="#d3d7df" font-size="15">Local preferences: formations, motion, edge, corrections</text><path d="M410 143 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="165" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="194" fill="white" font-size="20">Keyboard / floating Record</text><text x="60" y="220" fill="#d3d7df" font-size="15">Hold, tap, double-tap → transcription coordinator</text><path d="M410 243 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="265" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="294" fill="white" font-size="20">Local speech recognition</text><text x="60" y="320" fill="#d3d7df" font-size="15">Real microphone, recording and streaming events → companion</text><path d="M410 343 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="365" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="394" fill="white" font-size="20">Exact action / snippet matching</text><text x="60" y="420" fill="#d3d7df" font-size="15">Explicit action cue opens approved target; snippet keeps saved text</text><path d="M410 443 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="465" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="494" fill="white" font-size="20">Optional cleanup → local formatting</text><text x="60" y="520" fill="#d3d7df" font-size="15">Configured provider; visible fallback; whole-word corrections</text><path d="M410 543 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#b8ff65" stroke-width="2"/><rect x="40" y="565" width="740" height="78" rx="10" fill="#20242a" stroke="#626c78"/><text x="60" y="594" fill="white" font-size="20">Paste + local history</text><text x="60" y="620" fill="#d3d7df" font-size="15">Destination app receives text; Home shows the latest three entries</text></g></svg>