<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Say less, stress less: local dictation history and any imported Wispr Flow history flow into a read-only insights engine, the Insights screen, opt-in notes export, an opt-in local MCP server, and an opt-in AI summary">
  <rect width="900" height="560" fill="#111317"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8ff65"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c7cdd5"/></marker>
  </defs>
  <g font-family="system-ui,sans-serif">
    <text x="30" y="40" fill="#b8ff65" font-size="24">Say less, stress less</text>
    <text x="30" y="64" fill="#c7cdd5" font-size="13">Solid arrows run on demand, on this computer. Dashed arrows only happen when you opt in.</text>
    <rect x="20" y="84" width="600" height="456" rx="16" fill="none" stroke="#b8ff65" stroke-dasharray="0" stroke-width="1.5"/>
    <text x="36" y="108" fill="#b8ff65" font-size="13">This computer (default: nothing leaves)</text>

    <rect x="40" y="128" width="170" height="58" rx="10" fill="#20242a"/>
    <text x="125" y="152" fill="#f6f6f6" font-size="14" text-anchor="middle">Dictation</text>
    <text x="125" y="172" fill="#c7cdd5" font-size="11" text-anchor="middle">your own words</text>

    <rect x="40" y="220" width="170" height="70" rx="10" fill="#20242a"/>
    <text x="125" y="246" fill="#f6f6f6" font-size="14" text-anchor="middle">history.db</text>
    <text x="125" y="266" fill="#c7cdd5" font-size="11" text-anchor="middle">transcription_history</text>
    <text x="125" y="281" fill="#c7cdd5" font-size="11" text-anchor="middle">(SQLite, local)</text>

    <rect x="40" y="320" width="170" height="62" rx="10" fill="#20242a"/>
    <text x="125" y="342" fill="#f6f6f6" font-size="13" text-anchor="middle">wispr-history.sqlite</text>
    <text x="125" y="360" fill="#c7cdd5" font-size="11" text-anchor="middle">imported Wispr Flow history</text>
    <text x="125" y="374" fill="#c7cdd5" font-size="11" text-anchor="middle">(only if you imported it)</text>

    <rect x="260" y="210" width="190" height="90" rx="10" fill="#20242a" stroke="#b8ff65"/>
    <text x="355" y="238" fill="#f6f6f6" font-size="14" text-anchor="middle">Insights engine</text>
    <text x="355" y="258" fill="#c7cdd5" font-size="11" text-anchor="middle">keywords + cue words</text>
    <text x="355" y="274" fill="#c7cdd5" font-size="11" text-anchor="middle">read-only, no model</text>
    <text x="355" y="290" fill="#c7cdd5" font-size="11" text-anchor="middle">Mac + Windows</text>

    <rect x="260" y="330" width="190" height="80" rx="10" fill="#20242a"/>
    <text x="355" y="356" fill="#f6f6f6" font-size="14" text-anchor="middle">Insights screen</text>
    <text x="355" y="376" fill="#c7cdd5" font-size="11" text-anchor="middle">Fix this first · problems</text>
    <text x="355" y="392" fill="#c7cdd5" font-size="11" text-anchor="middle">ideas · search</text>

    <rect x="260" y="440" width="190" height="56" rx="10" fill="#20242a"/>
    <text x="355" y="464" fill="#f6f6f6" font-size="14" text-anchor="middle">Read digest aloud</text>
    <text x="355" y="482" fill="#c7cdd5" font-size="11" text-anchor="middle">built-in system voices</text>

    <rect x="470" y="128" width="136" height="80" rx="10" fill="#20242a"/>
    <text x="538" y="152" fill="#f6f6f6" font-size="13" text-anchor="middle">Notes folder</text>
    <text x="538" y="170" fill="#c7cdd5" font-size="10" text-anchor="middle">Daily/YYYY-MM-DD.md</text>
    <text x="538" y="185" fill="#c7cdd5" font-size="10" text-anchor="middle">Insights.md</text>
    <text x="538" y="200" fill="#c7cdd5" font-size="10" text-anchor="middle">[[wikilinks]]</text>

    <rect x="470" y="320" width="136" height="80" rx="10" fill="#20242a"/>
    <text x="538" y="344" fill="#f6f6f6" font-size="13" text-anchor="middle">Local MCP server</text>
    <text x="538" y="362" fill="#c7cdd5" font-size="10" text-anchor="middle">handy --mcp</text>
    <text x="538" y="377" fill="#c7cdd5" font-size="10" text-anchor="middle">stdio, read-only</text>
    <text x="538" y="392" fill="#c7cdd5" font-size="10" text-anchor="middle">no window/audio</text>

    <rect x="660" y="128" width="210" height="60" rx="10" fill="#1b1e23" stroke="#c7cdd5"/>
    <text x="765" y="152" fill="#f6f6f6" font-size="13" text-anchor="middle">Obsidian / notes app</text>
    <text x="765" y="172" fill="#c7cdd5" font-size="11" text-anchor="middle">opens the folder</text>

    <rect x="660" y="320" width="210" height="60" rx="10" fill="#1b1e23" stroke="#c7cdd5"/>
    <text x="765" y="344" fill="#f6f6f6" font-size="13" text-anchor="middle">Claude / MCP client</text>
    <text x="765" y="364" fill="#c7cdd5" font-size="11" text-anchor="middle">only if you add it</text>

    <rect x="660" y="440" width="210" height="80" rx="10" fill="#1b1e23" stroke="#ff9666"/>
    <text x="765" y="464" fill="#f6f6f6" font-size="13" text-anchor="middle">Your AI provider</text>
    <text x="765" y="482" fill="#c7cdd5" font-size="11" text-anchor="middle">BYO key / Apple Intelligence</text>
    <text x="765" y="498" fill="#c7cdd5" font-size="11" text-anchor="middle">gets labels, counts,</text>
    <text x="765" y="512" fill="#c7cdd5" font-size="11" text-anchor="middle">2 short quotes per topic</text>
  </g>
  <g fill="none" stroke-width="1.6">
    <path d="M125 186 V218" stroke="#b8ff65" marker-end="url(#a)"/>
    <path d="M210 255 H258" stroke="#b8ff65" marker-end="url(#a)"/>
    <path d="M355 300 V328" stroke="#b8ff65" marker-end="url(#a)"/>
    <path d="M355 410 V438" stroke="#b8ff65" marker-end="url(#a)"/>
    <path d="M450 230 C465 215 470 190 470 180" stroke="#b8ff65" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M210 350 C236 350 240 290 258 282" stroke="#b8ff65" marker-end="url(#a)"/>
    <path d="M40 255 H30 V522 H538 V404" stroke="#b8ff65" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M40 350 H30" stroke="#b8ff65" stroke-dasharray="6 5"/>
    <path d="M606 158 H658" stroke="#c7cdd5" marker-end="url(#b)"/>
    <path d="M606 350 H658" stroke="#c7cdd5" marker-end="url(#b)"/>
    <path d="M450 385 C560 420 600 470 658 478" stroke="#ff9666" stroke-dasharray="6 5" marker-end="url(#b)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" fill="#c7cdd5">
    <text x="214" y="248">read-only</text>
    <text x="440" y="120">opt-in export</text>
    <text x="108" y="514">read-only, opt-in (handy --mcp)</text>
    <text x="470" y="470">opt-in click</text>
  </g>
</svg>
